name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@1df1332562e952c254c4d5616658021c7034c080 # GetStream/stream-build-conventions-android#97, replace with the release
    with:
      release-bot-client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
      modules: "stream-chat-android-ai-compose"
      metrics-project: "stream-chat-android-ai-metrics"
    secrets:
      release-bot-private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
