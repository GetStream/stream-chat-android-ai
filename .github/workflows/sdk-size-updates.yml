name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@500ef3b1a9a1823213f37cf269ef409042f7c7d2 # v1.2.0
    with:
      release-bot-client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
      modules: "stream-chat-android-ai-compose"
      metrics-project: "stream-chat-android-ai-metrics"
    secrets:
      release-bot-private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
