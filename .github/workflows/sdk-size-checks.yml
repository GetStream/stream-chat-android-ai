name: SDK size checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-checks.yml@v0.13.1
    with:
      modules: "stream-chat-android-ai-compose"
      metrics-project: "stream-chat-android-ai-metrics"
